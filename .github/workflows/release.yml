name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SIGNAL_SUPABASE_URL: ${{ secrets.SIGNAL_SUPABASE_URL }}
      SIGNAL_SUPABASE_ANON_KEY: ${{ secrets.SIGNAL_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check cloud configuration
        run: |
          if [ -n "$SIGNAL_SUPABASE_URL" ] && [ -n "$SIGNAL_SUPABASE_ANON_KEY" ]; then
            echo "Building with account sync enabled (Supabase configured)."
          else
            echo "::warning::Supabase secrets not set - building local-first package with account sync unconfigured."
          fi
      - run: npm ci
      - run: npm run package
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
